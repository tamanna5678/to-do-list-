<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #FAEBD7, purple);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            height: 400px;
        }
        h2 {
            color: #6a0dad;
            font-size: 28px;
        }
        input {
            width: 90%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #6a0dad;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
        button:hover {
            background: #5a0cab;
        }
        p {
            margin-top: 20px;
            font-size: 16px;
        }
        span {
            color: #6a0dad;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2 id="form-title">Sign In</h2>
            <form id="auth-form" onsubmit="handleFormSubmit(event)">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Submit</button>
            </form>
            <p id="toggle-form">Don't have an account? <span>Sign Up</span></p>
        </div>
    </div>

    <script>
        // Toggle between Sign In and Sign Up forms
        document.getElementById("toggle-form").addEventListener("click", function() {
            let title = document.getElementById("form-title");
            let button = document.querySelector("button");
            let toggleText = document.getElementById("toggle-form");
            
            if (title.textContent === "Sign In") {
                title.textContent = "Sign Up";
                button.textContent = "Register";
                toggleText.innerHTML = "Already have an account? <span>Sign In</span>";
            } else {
                title.textContent = "Sign In";
                button.textContent = "Submit";
                toggleText.innerHTML = "Don't have an account? <span>Sign Up</span>";
            }
        });

        // Handle form submission and redirect
        function handleFormSubmit(event) {
            event.preventDefault(); // Prevent page reload on form submit
            
            // You can add form validation here if necessary
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Example check (you can replace with your actual logic)
            if (username && password) {
                // Redirect to a new page (e.g., dashboard.html) upon successful submission
                window.location.href = "content.html";  // Change to your target page
            }
        }
    </script>
</body>
</html>
